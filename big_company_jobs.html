<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All_Career - Big Company Jobs</title>
    <link rel="icon" href="String_Theory.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080f;
            --bg-sidebar: #0b1120;
            --bg-surface: #0e1424;
            --bg-card: rgba(16, 24, 48, 0.7);
            --bg-glass: rgba(12, 18, 35, 0.9);
            --bg-hover: rgba(52, 211, 153, 0.05);
            --primary: #34d399;
            --primary-dim: rgba(52, 211, 153, 0.15);
            --accent-blue: #60a5fa;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --accent-rose: #fb7185;
            --accent-amber: #fbbf24;
            --text-main: #f1f5f9;
            --text-muted: #7c8db5;
            --text-dim: #475775;
            --border: rgba(255, 255, 255, 0.07);
            --border-active: rgba(52, 211, 153, 0.3);
            --sidebar-width: 240px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        *::selection { background: rgba(52, 211, 153, 0.25); color: #fff; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Subtle animated background ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse 70% 50% at 15% 25%, rgba(52, 211, 153, 0.06), transparent),
                radial-gradient(ellipse 50% 40% at 85% 10%, rgba(96, 165, 250, 0.05), transparent),
                radial-gradient(ellipse 60% 50% at 60% 90%, rgba(167, 139, 250, 0.04), transparent);
        }

        /* ══════════════════════════════════════
           TOP NAVBAR
        ══════════════════════════════════════ */
        .topnav {
            position: sticky; top: 0; z-index: 200;
            background: rgba(6, 8, 15, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between; height: 60px;
            gap: 20px;
        }
        .topnav-left {
            flex: 1;
            display: flex;
            justify-content: flex-start;
        }
        .topnav-center {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .topnav-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }
        .topnav-logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .topnav-logo img { width: 32px; height: 32px; border-radius: 8px; }
        .topnav-logo span {
            font-family: 'Outfit', sans-serif; font-weight: 800;
            font-size: 1.2rem; color: #fff; letter-spacing: 0.5px;
        }
        .topnav-search {
            width: 100%; max-width: 380px;
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; padding: 0 14px; height: 38px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .topnav-search:focus-within {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.08);
        }
        .topnav-search svg { color: var(--text-muted); flex-shrink: 0; }
        .topnav-search input {
            flex: 1; background: none; border: none; outline: none;
            color: #ffffff; font-family: 'Inter', sans-serif;
            font-size: 0.88rem; font-weight: 500;
        }
        .topnav-search input::placeholder { color: var(--text-muted); }
        .topnav-count {
            font-size: 0.82rem; color: var(--text-muted); white-space: nowrap;
        }
        .topnav-count span { color: var(--primary); font-weight: 800; }
        .clear-all-btn {
            padding: 7px 16px; border-radius: 8px;
            border: 1px solid rgba(251, 113, 133, 0.3);
            background: rgba(251, 113, 133, 0.06);
            color: var(--accent-rose); font-size: 0.78rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            display: none; font-family: 'Inter', sans-serif;
        }
        .clear-all-btn.visible { display: block; }
        .clear-all-btn:hover { background: rgba(251, 113, 133, 0.12); border-color: rgba(251, 113, 133, 0.5); }

        /* ══════════════════════════════════════
           LAYOUT — SIDEBAR + MAIN
        ══════════════════════════════════════ */
        .page-layout {
            display: flex; min-height: calc(100vh - 60px);
        }

        /* ══════════════════════════════════════
           LEFT SIDEBAR
        ══════════════════════════════════════ */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: sticky; top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 0 0 40px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.06) transparent;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }

        /* Sidebar header */
        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-title {
            font-size: 0.95rem; font-weight: 700; color: var(--text-main);
        }
        .applied-badge {
            font-size: 0.72rem; font-weight: 700; padding: 3px 10px;
            background: rgba(52, 211, 153, 0.12);
            color: var(--primary); border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            display: none;
        }
        .applied-badge.visible { display: block; }

        /* ── Filter Section ── */
        .filter-section {
            border-bottom: 1px solid var(--border);
        }
        .filter-section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; cursor: pointer; user-select: none;
            transition: background 0.15s;
        }
        .filter-section-header:hover { background: rgba(255,255,255,0.02); }
        .filter-section-label {
            font-size: 0.88rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
            pointer-events: none;
        }
        .filter-section-label .filter-count {
            font-size: 0.68rem; font-weight: 700;
            background: var(--primary); color: #020a0f;
            padding: 1px 7px; border-radius: 20px;
            display: none;
            pointer-events: none;
        }
        .filter-section-label .filter-count.show { display: inline-block; }
        .chevron {
            color: var(--text-dim);
            width: 16px;
            height: 16px;
            transition: transform 0.25s ease;
            flex-shrink: 0;
            display: inline-block;
            pointer-events: none;
        }
        .filter-section.open .chevron { transform: rotate(180deg); }

        /* Filter body */
        .filter-body {
            overflow: hidden; max-height: 0;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 16px;
        }
        .filter-section.open .filter-body { max-height: 2000px; }
        .filter-body-inner { padding: 4px 0 14px; }

        /* Search inside filter */
        .filter-search {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .filter-search:focus-within { border-color: var(--border-active); }
        .filter-search svg { color: var(--text-dim); flex-shrink: 0; }
        .filter-search input {
            flex: 1; background: none; border: none; outline: none;
            color: var(--text-main); font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
        }
        .filter-search input::placeholder { color: var(--text-dim); }

        /* Checkbox option */
        .filter-option {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 4px; cursor: pointer; border-radius: 6px;
            transition: background 0.15s; user-select: none;
        }
        .filter-option:hover { background: var(--bg-hover); }
        .filter-option input[type="checkbox"] { display: none; }
        .custom-checkbox {
            width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
            border: 1.5px solid var(--text-dim);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .filter-option.checked .custom-checkbox {
            background: var(--primary); border-color: var(--primary);
        }
        .custom-checkbox svg { display: none; }
        .filter-option.checked .custom-checkbox svg { display: block; }
        .option-label {
            font-size: 0.82rem; color: var(--text-muted); flex: 1;
            font-weight: 500; transition: color 0.15s;
        }
        .filter-option:hover .option-label,
        .filter-option.checked .option-label { color: var(--text-main); }
        .source-count {
            font-size: 0.72rem; color: var(--text-dim); margin-left: 5px; font-weight: normal;
        }
        .option-img {
            width: 14px; height: 14px; object-fit: contain; border-radius: 2px; flex-shrink: 0;
        }
        .show-more-btn {
            font-size: 0.78rem; color: var(--primary); font-weight: 600;
            cursor: pointer; padding: 6px 4px; display: inline-block;
            transition: opacity 0.2s;
        }
        .show-more-btn:hover { opacity: 0.8; }

        /* Scrollable list options inside filters */
        #skills-options, #company-options, #location-options, #roles-options {
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        #skills-options::-webkit-scrollbar,
        #company-options::-webkit-scrollbar,
        #location-options::-webkit-scrollbar,
        #roles-options::-webkit-scrollbar {
            width: 4px;
        }
        #skills-options::-webkit-scrollbar-thumb,
        #company-options::-webkit-scrollbar-thumb,
        #location-options::-webkit-scrollbar-thumb,
        #roles-options::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        /* Radio option (for date) */
        .filter-radio {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 4px; cursor: pointer; border-radius: 6px;
            transition: background 0.15s; user-select: none;
        }
        .filter-radio:hover { background: var(--bg-hover); }
        .custom-radio {
            width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
            border: 1.5px solid var(--text-dim);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .filter-radio.selected .custom-radio {
            border-color: var(--primary);
        }
        .radio-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary); display: none;
        }
        .filter-radio.selected .radio-dot { display: block; }
        .filter-radio .option-label { color: var(--text-muted); }
        .filter-radio:hover .option-label,
        .filter-radio.selected .option-label { color: var(--text-main); }

        /* ══════════════════════════════════════
           MAIN CONTENT
        ══════════════════════════════════════ */
        .main-content {
            flex: 1; min-width: 0;
            padding: 20px 24px 80px;
        }

        /* Sort bar */
        .sort-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .sort-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }
        .sort-select {
            background: var(--bg-surface); border: 1px solid var(--border);
            color: var(--text-main); padding: 7px 12px; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-size: 0.8rem; outline: none; cursor: pointer;
        }
        .sort-select option { background: var(--bg-surface); }
        .sort-select:focus { border-color: var(--border-active); }

        /* Active filter chips */
        .active-chips {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 20px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            font-size: 0.75rem; font-weight: 600; color: var(--primary);
        }
        .chip-x {
            cursor: pointer; opacity: 0.7; font-size: 0.85rem; line-height: 1;
            transition: opacity 0.15s;
        }
        .chip-x:hover { opacity: 1; }

        /* ── Job Cards Grid ── */
        #loading {
            text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 500;
        }
        #loading::after {
            content: '';
            display: block; width: 28px; height: 28px; margin: 14px auto 0;
            border: 3px solid rgba(52, 211, 153, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: loadSpin 0.8s linear infinite;
        }
        @keyframes loadSpin { to { transform: rotate(360deg); } }

        #noResults {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
            display: none; font-style: italic; font-size: 0.95rem;
        }

        .jobs-grid {
            display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        }

        /* ── Job Card ── */
        .job-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 18px 20px;
            border-radius: 14px;
            display: flex; flex-direction: column; gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; transform: translateY(12px);
            animation: cardIn 0.45s forwards;
            width: 100%; height: 210px; box-sizing: border-box;
            overflow: hidden; position: relative;
        }
        .job-card::before {
            content: '';
            position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(52,211,153,0.25), rgba(96,165,250,0.2), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .job-card:hover::before { opacity: 1; }
        .job-card:hover {
            border-color: rgba(52, 211, 153, 0.18);
            transform: translateY(-4px);
            box-shadow: 0 16px 50px rgba(52, 211, 153, 0.1), 0 6px 24px rgba(0,0,0,0.4);
        }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        .card-top { display: flex; gap: 12px; align-items: flex-start; }
        .logo-box {
            width: 44px; height: 44px; flex-shrink: 0;
            background: rgba(255,255,255,0.95); border-radius: 10px;
            padding: 3px; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .job-card:hover .logo-box { transform: scale(1.06); }
        .company-logo { width: 38px; height: 38px; object-fit: contain; position: absolute; top:3px; left:3px; }
        .logo-fallback {
            width: 100%; height: 100%; border-radius: 7px; display: none;
            align-items: center; justify-content: center;
            background: linear-gradient(135deg, #059669, #0891b2);
            font-weight: 800; font-size: 1.1rem; color: white;
        }
        .card-info { flex: 1; min-width: 0; }
        .company-name {
            color: var(--text-muted); font-size: 0.72rem; font-weight: 600; margin-bottom: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .job-title {
            font-size: 0.92rem; line-height: 1.35; color: var(--text-main); font-weight: 700;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .job-meta {
            display: flex; flex-direction: column; gap: 4px;
        }
        .meta-row {
            display: flex; gap: 5px; align-items: center; overflow: hidden;
        }
        .meta-badge {
            font-size: 0.7rem; padding: 4px 9px; border-radius: 7px;
            background: rgba(255,255,255,0.04); color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.06);
            display: inline-flex; align-items: center; gap: 4px;
            white-space: nowrap; font-weight: 500;
            max-width: 120px; overflow: hidden; text-overflow: ellipsis;
        }
        .meta-badge.loc { color: var(--accent-blue); border-color: rgba(96,165,250,0.15); }
        .meta-badge.exp { color: var(--accent-amber); border-color: rgba(251,191,36,0.15); }
        .meta-badge.date { color: var(--primary); border-color: rgba(52,211,153,0.15); }
        .portal-badge {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px;
            border-radius: 7px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06); font-size: 0.68rem;
            color: var(--text-muted); flex-shrink: 0; font-weight: 500;
        }
        .portal-logo { width: 13px; height: 13px; object-fit: contain; border-radius: 2px; }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.04);
            margin-top: auto;
        }
        .card-role { color: var(--text-dim); font-size: 0.72rem; font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .apply-btn {
            padding: 7px 18px; background: transparent; color: var(--primary);
            text-decoration: none; font-weight: 700; border-radius: 9px;
            font-size: 0.8rem; border: 1px solid rgba(52,211,153,0.3);
            transition: all 0.25s; position: relative; overflow: hidden;
        }
        .apply-btn:hover {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white; border-color: transparent;
            box-shadow: 0 4px 18px rgba(52,211,153,0.3); transform: translateY(-1px);
        }

        /* ── Pagination ── */
        .pagination-container {
            display: flex; justify-content: center; align-items: center; gap: 6px;
            margin-top: 44px; flex-wrap: wrap;
        }
        .page-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--bg-surface); border: 1px solid var(--border);
            color: var(--text-muted); font-weight: 700; font-size: 0.88rem;
            cursor: pointer; transition: all 0.2s; display: flex;
            align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
        }
        .page-btn:hover { border-color: var(--primary); color: white; transform: translateY(-2px); }
        .page-btn.active {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white; border-color: transparent;
            box-shadow: 0 4px 16px rgba(52,211,153,0.3);
        }
        .page-btn.nav-btn { width: auto; padding: 0 14px; font-size: 1rem; }
        .page-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .page-ellipsis { color: var(--text-dim); padding: 0 4px; }

        /* ── Scroll to top ── */
        .scroll-top {
            position: fixed; bottom: 28px; right: 28px; z-index: 999;
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, #059669, #10b981);
            border: none; color: white; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(52,211,153,0.3);
            opacity: 0; transform: translateY(14px); pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scroll-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .scroll-top:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(52,211,153,0.4); }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .jobs-grid { grid-template-columns: 1fr; }
            .job-card { width: 100%; height: auto; }
            .topnav {
                flex-direction: column;
                height: auto;
                padding: 14px 16px;
                gap: 12px;
            }
            .topnav-left { order: 1; width: 100%; justify-content: center; }
            .topnav-center { order: 2; width: 100%; justify-content: center; }
            .topnav-right { order: 3; width: 100%; justify-content: center; }
            .topnav-search { max-width: 100%; }
        }
    .exp-input-container {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
    }
    .exp-input-container label {
        font-size: 13px;
        color: #64748b;
        white-space: nowrap;
    }
    .exp-input {
        width: 60px;
        padding: 6px 10px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        outline: none;
        transition: border-color 0.2s;
        background: #f8fafc;
        color: #111827;
    }
    .exp-input:focus {
        border-color: #111827;
        background: #fff;
    }
    .exp-input-suffix {
        font-size: 13px;
        color: #64748b;
    }
</style>
</head>

<body>

    <!-- ══ TOP NAVBAR ══ -->
    <nav class="topnav">
        <div class="topnav-left">
            <a href="index.html" class="topnav-logo">
                <img src="String_Theory.png" alt="Logo">
                <span>ALL_CAREER</span>
            </a>
        </div>

        <div class="topnav-center">
            <div class="topnav-search">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="Search big companies..." oninput="applyFilters()">
            </div>
        </div>

        <div class="topnav-right">
            <div class="topnav-count">Showing <span id="jobCount">0</span> jobs</div>
            <button class="clear-all-btn" id="clearAllBtn" onclick="clearAllFilters()">✕ Clear All</button>
        </div>
    </nav>

    <!-- ══ PAGE LAYOUT ══ -->
    <div class="page-layout">

        <!-- ══ LEFT SIDEBAR FILTERS ══ -->
        <aside class="sidebar">

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const clean = dateStr.replace(/[^a-zA-Z0-9\s-:,]/g, '').trim();
        const d = new Date(clean);
        if (isNaN(d.getTime())) return clean;
        const now = new Date();
        const diffMs = now - d;
        const diffDays = Math.floor(diffMs / 86400000);
        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return 'Yesterday';
        if (diffDays > 1 && diffDays <= 7) return diffDays + ' days ago';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

        selectedRoles.forEach(role => {

    async function fetchJobsFromGitHub() {
        const url = "https://raw.githubusercontent.com/ragesh28/ALL_CAREER/main/workday_scraper/big_company_jobs.json";
        try {
            const response = await fetch(url + "?t=" + new Date().getTime());
            if (!response.ok) throw new Error("Failed to connect to GitHub JSON");
            const rows = await response.json();
            const fetchedJobs = [];
            for (const job of rows) {
                const bad = v => !v || v === 'None' || v === 'nan' || v === 'null';
                const pick = (...vals) => { for (const v of vals) if (!bad(v)) return String(v); return ''; };
                const cleanDate = pick(job.fetched_at, job.fetchedAt, job.date, job.date_posted);
                fetchedJobs.push({
                    title: job.title || "",
                    company: job.company || "",
                    location: job.location || "",
                    date: cleanDate,
                    url: job.apply_url || job.url || "",
                    linkedin_url: job.linkedin_url || "",
                    fetchedAt: cleanDate
                });
            }
            return fetchedJobs;
        } catch (error) {
            console.error("Error fetching big jobs from GitHub:", error);
            return [];
        }
    }

    async function init() {
        buildLocationOptions();
        buildRolesOptions();
        const loading = document.getElementById('loading');
        loading.innerHTML = 'Connecting to GitHub repository and loading jobs...';
        allJobs = await fetchJobsFromGitHub();
        if (allJobs.length === 0) {
            loading.innerHTML = '<div style="color:#94a3b8; text-align:center"><h3>No jobs found</h3><p style="margin-top:10px">Could not load jobs from GitHub or none exist yet.</p></div>';
            return;
        }
        allJobs.sort((a, b) => (b.fetchedAt || '').localeCompare(a.fetchedAt || ''));
        updateCounts();
        applyFilters();
        loading.style.display = 'none';
    }

    function applyFilters() {
        const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const sortVal = document.getElementById('sortSelect').value;
        const now = new Date();
        now.setHours(0,0,0,0);

        filteredJobs = allJobs.filter(j => {
            const titleLow = (j.title || '').toLowerCase();
            const companyLow = (j.company || '').toLowerCase();
            const hay = [j.title, j.company, j.location].filter(Boolean).join(' ').toLowerCase();

            if (search && !hay.includes(search)) return false;

            // Location Filter
            if (selectedLocations.size > 0) {
                let matchedLoc = false;
                const jLoc = (j.location || '').toLowerCase();
                for (let loc of selectedLocations) {
                    if (jLoc.includes(loc.toLowerCase())) {
                        matchedLoc = true;
                        break;
                    }
                }
                if (!matchedLoc) return false;
            }

            // Roles Filter
            if (selectedRoles.size > 0) {
                let matchedRole = false;
                for (let role of selectedRoles) {
                    const kws = ROLE_KEYWORDS[role] || [role.toLowerCase()];
                    const match = kws.some(kw => {
                        if (kw.endsWith(' ')) {
                            return titleLow.includes(kw);
                        }
                        // Word boundary match
                        const esc_kw = kw.replace(/[-\/\\^$*+?.()|[\\]{}]/g, '\\$&');
                        const regex = new RegExp('(?:^|\\s|[\\-_/,])' + esc_kw + '(?:$|\\s|[\\-_/,])', 'i');
                        return regex.test(titleLow);
                    });
                    if (match) {
                        matchedRole = true;
                        break;
                    }
                }
                if (!matchedRole) return false;
            }

            // Date Filter
            if (activeDateRange !== 'all') {
                const jd = new Date((j.fetchedAt || '').slice(0, 10));
                if (isNaN(jd.getTime())) return false;
                const diff = Math.floor((now - jd) / 86400000);
                if (activeDateRange === '24h' && diff > 1) return false;
                if (activeDateRange === '3d' && diff > 3) return false;
                if (activeDateRange === '7d' && diff > 7) return false;
                if (activeDateRange === '15d' && diff > 15) return false;
            }

            return true;
        });

        // Sorting
        if (sortVal === 'company') {
            filteredJobs.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
        } else {
            filteredJobs.sort((a, b) => (b.fetchedAt || '').localeCompare(a.fetchedAt || ''));
        }

        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        const totalPages = Math.max(1, Math.ceil(filteredJobs.length / JOBS_PER_PAGE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * JOBS_PER_PAGE;
        renderJobs(filteredJobs.slice(start, start + JOBS_PER_PAGE));
        renderPagination(totalPages);
        document.getElementById('jobCount').textContent = filteredJobs.length;
    }

    function goToPage(p) {
        currentPage = p;
        renderPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderJobs(jobs) {
        const grid = document.getElementById('jobsGrid');
        const noRes = document.getElementById('noResults');
        if (jobs.length === 0) { grid.innerHTML = ''; noRes.style.display = 'block'; return; }
        noRes.style.display = 'none';
        grid.innerHTML = jobs.map((job, i) => {
            const logo = getLogoData(job.company || '');
            const date = formatDate(job.date || job.fetchedAt);
            const applyUrl = job.url || '';
            const rawLoc = job.location && job.location !== 'nan' && job.location !== 'None' ? job.location : 'India';
            const cityLoc = rawLoc.split(',')[0].trim();
            return `
            <div class="job-card" style="animation-delay:` + (i * 0.03) + `s">
                <div class="card-top">
                    <div class="logo-box">
                        <img src="` + logo.clearbit + `" class="company-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <img src="` + logo.google + `" class="company-logo" style="display:none" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <img src="` + logo.ddg + `" class="company-logo" style="display:none" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="logo-fallback">` + logo.initial + `</div>
                    </div>
                    <div>
                        <div class="company-name">` + esc(job.company) + `</div>
                        <div class="job-title">` + esc(job.title || 'Position') + `</div>
                    </div>
                </div>
                <div class="job-meta">
                    <div class="meta-row">
                        <div class="meta-badge loc">` + esc(cityLoc) + `</div>
                    </div>
                    <div class="meta-row">
                        ` + (date ? `<div class="meta-badge date">` + date + `</div>` : '') + `
                        <div class="meta-badge" style="color:var(--text-main); border-color:var(--border);">Direct Apply</div>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="card-role">` + esc(job.title || '') + `</span>
                    ` + (applyUrl ? `<a href="` + esc(applyUrl) + `" target="_blank" class="apply-btn">Apply →</a>` : '') + `
                </div>
            </div>`;
        }).join('');
    }

    function renderPagination(totalPages) {
        const c = document.getElementById('pagination');
        c.innerHTML = '';
        if (totalPages <= 1) return;
        const prev = document.createElement('button');
        prev.className = 'page-btn nav-btn'; prev.innerHTML = '←'; prev.disabled = currentPage === 1;
        prev.onclick = () => goToPage(currentPage - 1); c.appendChild(prev);
        const pages = [];
        if (totalPages <= 7) { for (let i = 1; i <= totalPages; i++) pages.push(i); }
        else {
            pages.push(1);
            if (currentPage > 3) pages.push('...');
            for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
            if (currentPage < totalPages - 2) pages.push('...');
            pages.push(totalPages);
        }
        pages.forEach(p => {
            if (p === '...') { const s = document.createElement('span'); s.className = 'page-ellipsis'; s.textContent = '...'; c.appendChild(s); }
            else { const b = document.createElement('button'); b.className = 'page-btn' + (p === currentPage ? ' active' : ''); b.textContent = p; b.onclick = () => goToPage(p); c.appendChild(b); }
        });
        const next = document.createElement('button');
        next.className = 'page-btn nav-btn'; next.innerHTML = '→'; next.disabled = currentPage === totalPages;
        next.onclick = () => goToPage(currentPage + 1); c.appendChild(next);
    }

    init();
    </script>
</body>

</html>
