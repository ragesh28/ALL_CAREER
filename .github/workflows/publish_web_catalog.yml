name: Publish Fast Web Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
  workflow_run:
    workflows:
      - 'Telegram Jobs Scraper (PaddleOCR + Gemini 2.5 Flash)'
      - 'Naukri Scraper (Playwright - FREE)'
      - 'All Jobs 2 (LinkedIn + Indeed → Cloudflare D1)'
      - 'Google image Extractor'
      - 'Foundit Jobs Scraper'
      - 'Job Portals Scraper (Shine, TimesJobs, Hirist, Apna, WorkIndia, Internshala, Freshersworld, Glassdoor)'
      - 'Google Jobs Aggregator (Cloudflare D1)'
      - 'API Call Jobs Scraper'
      - 'api_call_jobs2'
      - 'Remove LinkedIn Jobs'
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: fast-web-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            /scripts/build_web_catalog.py
            /scripts/job_archive_paths.py
            /data/jobs/
            /data/job_archives/
            /data/index/
            /data/web/
            /all_jobs_*.json
            /scraped_image_walkin_jobs.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build compressed browser pages and independent summaries
        run: python scripts/build_web_catalog.py
      - name: Publish catalog snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/web
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(web): publish newest-first browser pages [skip ci]'
          # Scrapers can finish during the build. Rebase preserves their source data.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              gh api --method POST "repos/${{ github.repository }}/pages/builds"
              exit 0
            fi
          done
          exit 1
