name: Daily Job Drops Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day) daily

jobs:
  scrape-daily-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      # Scrape only companies listed in companies.json using Puppeteer
      - name: Run Daily Scraper (companies.json)
        env:
          COMPANIES_JSON: ${{ secrets.COMPANIES_JSON }}
        run: node scrape.js

      # Remove jobs older than 30 days
      - name: Clean Old Jobs
        run: node clean_jobs.js

      # Save jobs.json and jobs_data.js back to repo
      - name: Commit and Push Daily Jobs
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -f jobs.json jobs_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily job drops update (companies.json companies)" && git push)
