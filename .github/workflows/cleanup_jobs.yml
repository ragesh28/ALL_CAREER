name: Remove LinkedIn Jobs

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  remove-linkedin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Remove LinkedIn Jobs
        run: python remove_linkedin_jobs.py

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Remove old chunk files that no longer exist on disk
          for f in $(git ls-files 'all_jobs_*.json'); do
            if [ ! -f "$f" ]; then
              echo "Removing deleted file from git: $f"
              git rm "$f"
            fi
          done
          
          # Stage all job data changes
          git add all_jobs_*.json role_index.json jobs_by_role/ || true
          
          echo "=== Files staged for commit ==="
          git diff --cached --stat
          
          git commit -m "chore: remove LinkedIn jobs from database [skip ci]" || echo "No changes to commit"
          git pull --rebase -X ours --autostash origin main
          git push
