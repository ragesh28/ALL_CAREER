name: Google Jobs Aggregator (Cloudflare D1)

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day)

jobs:
  scrape-all-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas requests python-jobspy
          playwright install chromium

      - name: Run Google Jobs Aggregator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scrape_google_jobs.py

      - name: Cleanup
        if: always()
        run: |
          echo "✅ Google Jobs Aggregator completed."
          echo "📊 Check Turso database for results."
