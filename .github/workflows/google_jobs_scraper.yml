name: Google Jobs Aggregator (Turso)

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day)

jobs:
  scrape-all-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-jobspy pandas requests

      - name: Run Google Jobs Aggregator
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python scrape_google_jobs.py

      # Commit the generated JS file for GitHub Pages
      - name: Commit and Push All Jobs Data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "chore: Update scraped jobs data" && git push)
