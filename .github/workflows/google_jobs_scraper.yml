name: Google Jobs Aggregator (Turso)

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day)

jobs:
  scrape-all-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas requests
          playwright install chromium

      - name: Run Google Jobs Aggregator
        env:
          TURSO_ALLJOBS_URL: ${{ secrets.TURSO_ALLJOBS_URL }}
          TURSO_ALLJOBS_TOKEN: ${{ secrets.TURSO_ALLJOBS_TOKEN }}
          WEBSHARE_PROXIES: ${{ secrets.WEBSHARE_PROXIES }}
        run: python scrape_google_jobs.py

      # Save progress checkpoint so it can resume if rate limited/timeout
      - name: Commit and Push Scrape Progress
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -f google_progress.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: save google scraper progress" && git push)

      # If google_progress.json exists -> scraper hit time limit -> restart in 10 min
      - name: Auto-Restart if Not Finished
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f google_progress.json ]; then
            echo "⚠️  Scraper stopped mid-run (time limit). Waiting 10 minutes then restarting..."
            sleep 600
            echo "🔄 Triggering workflow restart..."
            gh workflow run google_jobs_scraper.yml --repo ${{ github.repository }}
            echo "✅ Restart triggered. It will resume from where it stopped."
          else
            echo "✅ Scraper completed all roles and locations. No restart needed."
          fi

