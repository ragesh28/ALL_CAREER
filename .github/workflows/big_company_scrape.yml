name: Big Company Jobs Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (1:30 AM UTC) daily

jobs:
  scrape-big-companies:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours (GitHub max)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install python-jobspy pandas requests

      # Scrape 150 top companies from Indeed with direct apply links
      - name: Run Big Company Scraper (Indeed Direct Links)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python step3_big_company_scrape.py

      # Save progress checkpoint so it can resume if rate limited/timeout
      - name: Commit and Push Scrape Progress
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -f scrape_progress.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: save big company scraper progress" && git pull --rebase && git push)

      # If scrape_progress.json exists → scraper hit time limit → restart in 10 min
      - name: Auto-Restart if Not Finished
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scrape_progress.json ]; then
            echo "Scraper stopped mid-run (time limit). Waiting 10 minutes then restarting..."
            sleep 600
            echo "Triggering workflow restart..."
            gh workflow run big_company_scrape.yml --repo ${{ github.repository }}
            echo "Restart triggered. It will resume from where it stopped."
          else
            echo "Scraper completed all companies. No restart needed."
          fi
