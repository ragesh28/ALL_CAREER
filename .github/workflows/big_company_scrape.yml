name: Big Company Jobs Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (1:30 AM UTC) daily

permissions:
  contents: write
  actions: write

concurrency:
  group: big-company-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape-big-companies:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_WORKERS_AI_ACCOUNTS: ${{ secrets.CLOUDFLARE_WORKERS_AI_ACCOUNTS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      COMPANY_AI_MAX_CALLS: '300'
      COMPANY_AI_MAX_SECONDS: '300'
    timeout-minutes: 360  # 6 hours (GitHub max)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install curl_cffi python-jobspy pandas requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      # Scrape 150 top companies from Indeed with direct apply links
      - name: Run Big Company Scraper (Indeed Direct Links)
        run: python step3_big_company_scrape.py

      # Save progress checkpoint so it can resume if rate limited/timeout
      - name: Commit and Push Scrape Progress
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANY_PUBLISH_GITHUB_API: '1'
        run: |
          set -euo pipefail
          for path in workday_scraper/big_company_jobs.json data/big_company_jobs.json data/company_job_history data/company_scraper2 scrape_progress.json; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          python -m scripts.publish_company_catalog

      - name: Auto-Restart if Not Finished
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scrape_progress.json ]; then
            echo "Scraper stopped mid-run (time limit). Waiting 10 minutes then restarting..."
            sleep 5
            echo "Triggering workflow restart..."
            gh workflow run big_company_scrape.yml --repo ${{ github.repository }}
            echo "Restart triggered. It will resume from where it stopped."
          else
            echo "Scraper completed all companies. No restart needed."
          fi
