name: Deploy All Career Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Optional recovery run from this Pages workflow; reuses its uploaded package
        type: string
        default: ''
  workflow_run:
    workflows: ['Publish Fast Web Catalog', 'Workflow Health & Telemetry Monitor', 'Big Company Jobs Scraper', 'Big Company Scraper 2', 'API Call Jobs Scraper', 'api_call_jobs2', 'Check Company AI Health']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: all-career-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.artifact_run_id == '' || github.event_name != 'workflow_dispatch'
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /about.html
            /string_theory.html
            /all_jobs.html
            /big_company_jobs.html
            /career_explorer.html
            /practice.html
            /all_questions.html
            /granular_jobs.html
            /top_companys.html
            /top_companys.js
            /String_Theory.png
            /assets/
            /logos/
            /data/web/
            /data/big_company_jobs.json
            /data/leetcode_companies.json
            /data/company_scraper2/latest.json
            /data/company_scraper2/ai_status.json
            /data/admin_metrics.json
            /data/string_theory_metrics.json
            /workday_scraper/big_company_jobs.json
            /workday_scraper/companies_links.json
            /data/index/
            /data/jobs/
            /all_career_auto_apply.js
            /all_career_auto_apply.css
            /companies.js
            /logos.js
            /logo3d.js
            /logo3d.css
            /top150.js
            /skills_map.json
            /scripts/deploy_pages.cjs
      - name: Checkout only the deployment helper for artifact recovery
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/deploy_pages.cjs
      - name: Package public website
        if: inputs.artifact_run_id == '' || github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          mkdir site
          git sparse-checkout list | while IFS= read -r path; do
            source=${path#/}
            case "$source" in scripts/*) continue ;; esac
            if [ -e "$source" ]; then
              cp -r --parents -- "$source" site/
            fi
          done
          test -f site/index.html
          test -f site/about.html
          test -f site/data/web/summary.json
          test -f site/data/web/latest.json
          if find site -type f \( -name '*.py' -o -name '*.sql' -o -name '*.db' -o -name 'whoami.txt' \) | grep -q .; then
            echo 'Unexpected source or database file in Pages artifact'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        if: inputs.artifact_run_id == '' || github.event_name != 'workflow_dispatch'
        id: upload
        with:
          path: site
      - name: Deploy the exact uploaded Pages package
        uses: actions/github-script@v9
        id: deploy
        timeout-minutes: 12
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_RECOVERY_RUN: ${{ inputs.artifact_run_id || '' }}
          PAGES_BUILD_VERSION: ${{ github.sha }}
        with:
          script: |
            const {deployPages}=require(process.env.GITHUB_WORKSPACE+'/scripts/deploy_pages.cjs');
            await deployPages({github,context,core,artifactId:process.env.PAGES_ARTIFACT_ID,
              recoverRunId:process.env.PAGES_RECOVERY_RUN,buildVersion:process.env.PAGES_BUILD_VERSION});
