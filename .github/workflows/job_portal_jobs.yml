name: Job Portal Jobs Scraper

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day)

jobs:
  scrape-job-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours maximum runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 playwright pandas

      - name: Install Playwright Chromium with dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Job Portals Scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRAPERAPI_KEY_2: ${{ secrets.SCRAPERAPI_KEY_2 }}
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          OXYLABS_ENTRYPOINT: ${{ vars.OXYLABS_ENTRYPOINT }}
          OXYLABS_PORTS: ${{ vars.OXYLABS_PORTS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scrape_job_portals.py

      # Always commit and push progress to save state (even on timeout/failure)
      - name: Commit and Push Scrape Progress
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add job_portals_progress.json || true
          git commit -m "chore: save job portals scraper progress [skip ci]" || echo "No progress changes to commit"
          git pull --rebase -X theirs --autostash origin main
          git push

      # Auto-restart if stopped mid-run
      - name: Auto-Restart if Not Finished
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f job_portals_progress.json ]; then
            FINISHED=$(python -c "import json; d=json.load(open('job_portals_progress.json')); print(d.get('finished', False))")
            if [ "$FINISHED" = "False" ]; then
              echo "⚠️ Scraper stopped mid-run. Triggering restart..."
              gh workflow run job_portal_jobs.yml --repo ${{ github.repository }}
              echo "✅ Restart triggered. New run will resume progress."
            else
              echo "✅ Scraper completed all combinations. No restart needed."
            fi
          else
            echo "✅ No progress file found. Scraper completed normally."
          fi
