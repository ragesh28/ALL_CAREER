name: Foundit Jobs Scraper

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day)

jobs:
  scrape-job-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours maximum runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 pandas curl_cffi

      - name: Run Foundit Scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scrape_job_portals.py

      # Always commit and push progress to save state (even on timeout/failure)
      - name: Commit and Push Scrape Progress
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          python merge_scraped_jobs.py || true
          git add job_portals_progress.json  all_jobs_*.json || true
          git commit -m "chore: save job portals scraper progress [skip ci]" || echo "No progress changes to commit"
          git pull --rebase -X theirs --autostash origin main
          git push

      # Auto-restart if stopped mid-run (only if not cancelled manually)
      - name: Auto-Restart if Not Finished
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f job_portals_progress.json ]; then
            FINISHED=$(python -c "import json; d=json.load(open('job_portals_progress.json')); print(d.get('finished', False))")
            if [ "$FINISHED" = "False" ]; then
              echo "Scraper stopped mid-run. Triggering restart..."
              gh workflow run job_portal_jobs.yml --repo ${{ github.repository }}
              echo "Restart triggered. New run will resume progress."
            else
              echo "Scraper completed all combinations. No restart needed."
            fi
          else
            echo "No progress file found. Scraper completed normally."
          fi
