name: Split 600K Jobs into Granular JSON Shards

on:
  workflow_dispatch: # Manual one-click trigger from GitHub Actions UI

jobs:
  split-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Granular Job Splitter
        run: |
          python scripts/split_existing_jobs.py

      - name: Verify Shards and Manifest Integrity
        run: |
          python -c "
          import json, os
          with open('data/index/manifest.json') as f:
              m = json.load(f)
          print('Verified total jobs:', m.get('total_jobs'))
          print('Verified total files:', m.get('total_files'))
          assert m.get('total_jobs', 0) > 500000, 'Job count unexpectedly low'
          "

      - name: Commit and Push Granular Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: partition 600k jobs into granular role/source/city JSON shards" || echo "No changes to commit"
          git push origin main
