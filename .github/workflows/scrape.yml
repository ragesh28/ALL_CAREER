name: Daily Job Scraper

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'  # Runs daily at 1:30 AM UTC = 7:00 AM IST

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      # 1. RUN THE EXISTING SCRAPER (unchanged)
      - name: Run Scraper
        env:
          COMPANIES_JSON: ${{ secrets.COMPANIES_JSON }}
        run: node scrape.js

      # 2. RUN THE CLEANER (unchanged)
      - name: Clean Old Jobs
        run: node clean_jobs.js

      # 3. SETUP PYTHON FOR BIG COMPANY SCRAPER
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_py.txt

      # 4. RUN BIG COMPANY SCRAPER (150 companies via jobspy)
      - name: Run Big Company Scraper
        run: python step3_big_company_scrape.py

      # 5. SAVE CHANGES
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # The -f flag forces git to add the file even if it is in .gitignore
          git add -f jobs.json jobs_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily job update + cleanup + big company scrape" && git push)