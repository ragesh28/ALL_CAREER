name: Workflow Health & Telemetry Monitor

on:
  schedule:
    - cron: '0 * * * *'    # Runs every 1 hour
  workflow_dispatch:        # Manual trigger anytime

permissions:
  contents: write
  actions: read

jobs:
  monitor-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Health & Scraper Metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_admin_metrics.py

      - name: Commit and Push Metrics Checkpoint
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/admin_metrics.json data/string_theory_metrics.json all-career-app/public/data/admin_metrics.json all-career-app/public/data/string_theory_metrics.json || true
          git diff --cached --quiet || git commit -m "chore(metrics): update workflow health & scraper telemetry [skip ci]"
          git pull --rebase -X theirs --autostash origin main
          git push origin main || echo "Metrics push skipped or already up to date"
