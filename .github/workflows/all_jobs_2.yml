name: All Jobs 2 (LinkedIn + Indeed → Cloudflare D1)

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (1:30 AM UTC)

jobs:
  scrape-linkedin-indeed:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # 5h 55m — leave buffer before 6h hard limit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-jobspy pandas requests

      - name: Run LinkedIn + Indeed Scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scrape_alljobs2.py

      # Always save progress (even on timeout/failure)
      - name: Commit and Push Scrape Progress
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add alljobs2_progress.json || true
          git commit -m "chore: save alljobs2 scraper progress [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push

      # Auto-restart if stopped mid-run
      # NOTE: No sleep here — sleeping inside a dying job causes "Operation canceled".
      #       We trigger the restart immediately; GitHub queues it and runs it fresh.
      - name: Auto-Restart if Not Finished
        # Use always() WITHOUT !cancelled() so it runs even on timeout-triggered cancellation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f alljobs2_progress.json ]; then
            FINISHED=$(python -c "import json; d=json.load(open('alljobs2_progress.json')); print(d.get('finished', False))")
            if [ "$FINISHED" = "False" ]; then
              echo "⚠️  Scraper stopped mid-run. Triggering restart..."
              gh workflow run all_jobs_2.yml --repo ${{ github.repository }}
              echo "✅ Restart triggered. New run will pick up from saved progress."
            else
              echo "✅ Scraper completed all roles. No restart needed."
            fi
          else
            echo "✅ No progress file found. Scraper completed normally."
          fi
