name: Job Portals Scraper (Shine, TimesJobs, Hirist, Apna, WorkIndia, Internshala, Freshersworld, Glassdoor)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Verify one role and city instead of the full scraping queue'
        type: boolean
        default: false
  schedule:
    - cron: '30 22 * * *'  # 4:00 AM IST (10:30 PM UTC previous day)

permissions:
  contents: write
  actions: write

jobs:
  scrape-job-portals-normal:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours maximum runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 playwright pandas python-jobspy curl_cffi

      - name: Install Playwright Chromium with dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Job Portals Scraper (Normal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PORTAL_TEST_MODE: ${{ inputs.test_mode || 'false' }}
        run: |
          if [ "$PORTAL_TEST_MODE" = "true" ]; then
            python -u scrape_job_portals_2.py --test
          else
            python -u scrape_job_portals_2.py
          fi

      # Always commit and push progress to save state (even on timeout/failure)
      - name: Commit and Push Scrape Progress
        id: save_checkpoint
        if: always() && !cancelled()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          python merge_scraped_jobs.py --commit-message "chore: save normal job portals scraper progress [skip ci]" job_portals_2_progress.json job_portals_2_health.json

      # Auto-restart if stopped mid-run (only if not cancelled manually)
      - name: Auto-Restart if Not Finished
        if: always() && !cancelled() && steps.save_checkpoint.outcome == 'success' && inputs.test_mode != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f job_portals_2_progress.json ]; then
            FINISHED=$(python -c "import json; d=json.load(open('job_portals_2_progress.json')); print(d.get('finished', False))")
            if [ "$FINISHED" = "False" ]; then
              echo "⚠️ Scraper stopped mid-run. Triggering restart..."
              gh workflow run job_portal_jobs_2.yml --repo ${{ github.repository }}
              echo "✅ Restart triggered. New run will resume progress."
            else
              echo "✅ Scraper completed all combinations. No restart needed."
            fi
          else
            echo "✅ No progress file found. Scraper completed normally."
          fi
