name: Glassdoor Scraping Test

on:
  workflow_dispatch:

jobs:
  test-glassdoor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests curl_cffi beautifulsoup4 urllib3

      - name: Run Glassdoor Test (All Methods)
        env:
          SCRAPERAPI_KEYS_LIST: ${{ secrets.SCRAPERAPI_KEYS_LIST }}
        run: |
          python test_glassdoor_methods.py
