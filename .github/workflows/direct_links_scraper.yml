name: Direct Links Scraper (Turso)

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC previous day)

jobs:
  scrape-direct-links:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-jobspy pandas requests

      - name: Run Direct Links Scraper
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python scrape_direct_links.py
