name: API Call Jobs Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC (7:30 AM IST)

jobs:
  scrape-api-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 playwright pandas
          playwright install --with-deps chromium

      - name: Run API Scraper
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          cd workday_scraper
          python scrape_all_companies_v2.py
