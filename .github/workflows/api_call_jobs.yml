name: API Call Jobs Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC) daily

jobs:
  scrape-api-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 playwright pandas python-jobspy
          playwright install --with-deps chromium

      - name: Run API Scraper
        run: |
          cd workday_scraper
          python scrape_all_companies_v2.py

      - name: Commit and Push Database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add workday_scraper/big_company_jobs.json
          git commit -m "chore(jobs): Update big company jobs JSON [skip ci]" || echo "No new jobs to commit"
          git push
