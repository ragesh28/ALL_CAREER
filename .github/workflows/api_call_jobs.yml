name: API Call Jobs Scraper

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Collect one live sample per company without saving production jobs
        type: boolean
        default: false
      audit_engine:
        description: Engine to audit
        type: choice
        options: [all, direct, md, indeed]
        default: all
      audit_companies:
        description: Optional comma separated company names to retest
        type: string
        default: ''
      investigate_companies:
        description: Inspect every employer with a browser and configured providers
        type: boolean
        default: false
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST (9:30 PM UTC) daily

permissions:
  contents: write
  actions: write

concurrency:
  group: big-company-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape-api-jobs:
    if: inputs.audit_only != true && inputs.investigate_companies != true
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_WORKERS_AI_ACCOUNTS: ${{ secrets.CLOUDFLARE_WORKERS_AI_ACCOUNTS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      COMPANY_AI_MAX_CALLS: '300'
      COMPANY_AI_MAX_SECONDS: '300'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install curl_cffi requests beautifulsoup4 playwright pandas python-jobspy
          playwright install --with-deps chromium

      - name: Run API Scraper
        run: |
          cd workday_scraper
          python scrape_all_companies_v2.py
          cd ..
          cp workday_scraper/big_company_jobs.json data/big_company_jobs.json || true

      - name: Commit and Push Database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANY_PUBLISH_GITHUB_API: '1'
        run: |
          set -euo pipefail
          for path in workday_scraper/big_company_jobs.json data/big_company_jobs.json data/company_job_history data/company_scraper2 data/job_archives role_index.json jobs_by_role; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          python -m scripts.publish_company_catalog
