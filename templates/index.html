<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL_CAREER — Jobs</title>
    <meta name="description" content="Browse Google jobs with direct apply links">
    <link rel="icon" href="{{ url_for('static', filename='String_Theory.png') }}" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Animated Header -->
    <header id="main-header">
        <a href="/hub" style="text-decoration:none;">
            <h1>ALL_CAREER</h1>
        </a>
    </header>

    <!-- Sticky Glass Filter Bar -->
    <div class="filter-bar-container">
        <div class="filter-bar">
            <a href="/hub" class="mini-logo">ALL_CAREER</a>
            <input type="text" id="searchInput" class="filter-input" placeholder="Search jobs..."
                oninput="filterJobs()">
            <div class="job-count-badge"><span id="totalJobs">0</span> jobs</div>
            <a href="/hub" class="btn-back">Hub</a>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-line">
        Showing <span id="visibleCount" style="color:white; font-weight:700;">0</span> active listings
    </div>

    <!-- Jobs Grid -->
    <div class="container">
        <div class="jobs-grid" id="jobsGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <h3>No jobs found</h3>
            <p>Try adjusting your search.</p>
        </div>
        <div id="pagination" class="pagination-container"></div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
