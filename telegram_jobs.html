<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All_Career - Telegram Jobs</title>
    <meta name="description" content="AI-powered job listings scraped from 27+ Telegram channels. Walking interviews, freshers, and experienced roles across India.">
    <link rel="icon" href="String_Theory.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-surface: #0f172a;
            --bg-glass: rgba(15, 23, 42, 0.95);
            --primary: #0088cc;
            --primary-glow: rgba(0, 136, 204, 0.15);
            --accent: #8b5cf6;
            --walk-in: #eab308;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0, 136, 204, 0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.06), transparent 40%);
            background-attachment: fixed;
        }

        /* --- HEADER --- */
        #main-header {
            text-align: center; padding-top: 60px; padding-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; opacity: 1;
        }
        body.scrolled #main-header { opacity: 0; padding-top: 0; height: 0; transform: scale(0.8); margin-bottom: 0; }

        h1 {
            font-family: 'Outfit', sans-serif; font-size: 3.2rem; font-weight: 800;
            background: linear-gradient(135deg, #0088cc, #8b5cf6);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer; transition: letter-spacing 0.5s ease;
            letter-spacing: -1px; text-decoration: none; margin: 0;
        }
        h1:hover { letter-spacing: 5px; }

        .header-subtitle {
            color: var(--text-muted); margin-top: 10px; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .header-subtitle .tg-icon {
            width: 20px; height: 20px; vertical-align: middle;
        }
        .live-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--success);
            display: inline-block; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* --- FILTER BAR --- */
        .filter-bar-container {
            position: sticky; top: 20px; z-index: 100;
            padding: 0 20px; display: flex; flex-direction: column; align-items: center;
            gap: 10px; margin-bottom: 20px; pointer-events: none;
        }
        .filter-bar {
            width: 100%; max-width: 1100px;
            display: flex; gap: 10px; background: var(--bg-glass);
            backdrop-filter: blur(12px); padding: 12px 18px; border-radius: 50px;
            border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            align-items: center; flex-wrap: wrap; pointer-events: auto;
        }
        .mini-logo {
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.1rem;
            color: var(--primary); white-space: nowrap; cursor: pointer;
            margin-right: 10px; text-decoration: none;
        }
        .filter-group { flex: 1; min-width: 110px; }
        .filter-input {
            width: 100%; background: var(--bg-deep); border: 1px solid var(--border);
            color: white; padding: 9px 14px; border-radius: 20px; outline: none;
            font-family: inherit; font-size: 0.85rem; transition: 0.3s;
        }
        .filter-input:focus { border-color: var(--primary); }
        select.filter-input option { background-color: var(--bg-deep); color: white; }

        /* --- WALK-IN TOGGLE --- */
        .walkin-toggle {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(234, 179, 8, 0.3);
            background: transparent; color: var(--walk-in);
            cursor: pointer; font-weight: 700; font-size: 0.82rem;
            font-family: inherit; white-space: nowrap; transition: 0.2s;
            user-select: none;
        }
        .walkin-toggle:hover { background: rgba(234, 179, 8, 0.1); }
        .walkin-toggle.active {
            background: var(--walk-in); color: #020617;
            border-color: var(--walk-in); box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
        }

        /* --- EXPERIENCE PILLS --- */
        .exp-group { display: flex; gap: 6px; }
        .exp-btn {
            padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); cursor: pointer;
            font-weight: 600; font-size: 0.8rem; transition: 0.2s;
            font-family: inherit; white-space: nowrap;
        }
        .exp-btn:hover { border-color: var(--primary); color: white; }
        .exp-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- SOURCE FILTER STRIP --- */
        .source-strip {
            width: 100%; max-width: 1100px; pointer-events: auto;
        }
        .source-strip-inner {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            background: rgba(15,23,42,0.7); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 10px 16px;
        }
        .source-label {
            font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap;
            padding-right: 6px; border-right: 1px solid var(--border); margin-right: 4px;
        }
        .source-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 20px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            cursor: pointer; transition: all 0.18s;
            font-size: 0.74rem; font-weight: 600; color: var(--text-muted);
            user-select: none; white-space: nowrap;
        }
        .source-pill:hover { border-color: var(--primary); color: white; background: rgba(0,136,204,0.08); }
        .source-pill.active {
            background: rgba(0,136,204,0.15); border-color: var(--primary);
            color: var(--primary); box-shadow: 0 0 10px rgba(0,136,204,0.2);
        }
        .source-pill img { width: 15px; height: 15px; object-fit: contain; border-radius: 3px; }
        .source-all-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 14px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            cursor: pointer; transition: 0.18s;
            font-size: 0.74rem; font-weight: 700; color: white;
            user-select: none; white-space: nowrap;
        }
        .source-all-btn:hover { background: rgba(255,255,255,0.1); }

        /* --- DATE PILLS --- */
        .date-pills { display: flex; gap: 6px; }
        .date-pill {
            padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); cursor: pointer;
            font-weight: 600; font-size: 0.78rem; transition: 0.2s;
            font-family: inherit; white-space: nowrap;
        }
        .date-pill:hover { border-color: var(--primary); color: white; }
        .date-pill.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- JOB CARDS --- */
        .container { max-width: 100%; margin: 0 auto; padding: 0 30px 100px; }
        .stats {
            color: var(--text-muted); margin-bottom: 20px; text-align: center; font-size: 1.05rem;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .stat-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
        }
        .jobs-grid {
            display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            align-items: stretch;
        }

        .job-card {
            background: var(--bg-surface); border: 1px solid var(--border);
            padding: 22px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 12px;
            transition: all 0.2s ease;
            opacity: 0; transform: translateY(12px); animation: cardIn 0.5s forwards;
            height: 100%; position: relative;
        }
        .job-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .job-card.walkin-card { border-left: 3px solid var(--walk-in); }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        .card-source-stripe {
            position: absolute; top: 0; right: 20px;
            padding: 4px 12px; border-radius: 0 0 10px 10px;
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px;
        }
        .stripe-telegram { background: rgba(0,136,204,0.15); color: #0088cc; }
        .stripe-linkedin { background: rgba(10,102,194,0.15); color: #0a66c2; }
        .stripe-naukri { background: rgba(74,144,217,0.15); color: #4A90D9; }
        .stripe-indeed { background: rgba(0,58,155,0.15); color: #6c8bc2; }
        .stripe-other { background: rgba(255,255,255,0.05); color: var(--text-muted); }

        .card-top { display: flex; gap: 14px; align-items: flex-start; margin-top: 8px; }
        .logo-box {
            width: 48px; height: 48px; position: relative;
            background: white; border-radius: 12px; padding: 4px; flex-shrink: 0;
        }
        .company-logo { width: 40px; height: 40px; object-fit: contain; position: absolute; top: 4px; left: 4px; }
        .logo-fallback {
            width: 100%; height: 100%; background: linear-gradient(135deg, #0088cc, #8b5cf6);
            border-radius: 8px; display: none; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.3rem; color: white;
        }
        .company-name {
            color: var(--text-muted); font-size: 0.78rem; font-weight: 600; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
        }
        .job-title {
            font-size: 0.95rem; line-height: 1.35; color: white; font-weight: 700;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; min-height: 2.5em;
        }

        .job-details { display: flex; flex-wrap: wrap; gap: 6px; }
        .detail-badge {
            font-size: 0.73rem; padding: 5px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.04); color: var(--text-muted);
            border: 1px solid var(--border); display: flex; align-items: center; gap: 4px;
        }
        .walkin-badge {
            border-color: rgba(234,179,8,0.4); color: var(--walk-in);
            background: rgba(234,179,8,0.08); font-weight: 700;
        }
        .walkin-badge::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--walk-in); animation: pulse 2s infinite;
        }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px solid var(--border); margin-top: auto;
        }
        .card-date { color: var(--text-muted); font-size: 0.78rem; }
        .apply-btn {
            padding: 9px 20px; background: transparent; color: var(--primary);
            text-decoration: none; font-weight: 700; border-radius: 12px;
            font-size: 0.83rem; border: 1px solid var(--primary); transition: 0.2s;
        }
        .apply-btn:hover { background: var(--primary); color: white; }

        #loading { text-align: center; padding: 50px; color: var(--text-muted); }
        #noResults { text-align: center; padding: 40px; color: var(--text-muted); display: none; font-style: italic; }

        .pagination-container {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-top: 50px; padding: 20px 0; flex-wrap: wrap;
        }
        .page-btn {
            width: 44px; height: 44px; border-radius: 12px; background: var(--bg-surface);
            border: 1px solid var(--border); color: var(--text-muted);
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center;
            justify-content: center; font-family: inherit;
        }
        .page-btn:hover { border-color: var(--primary); color: white; transform: translateY(-2px); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(0,136,204,0.4); }
        .page-btn.nav-btn { width: auto; padding: 0 16px; font-size: 1.1rem; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .page-ellipsis { color: var(--text-muted); font-size: 1.1rem; padding: 0 4px; }

        /* Responsive */
        @media (max-width: 500px) {
            .jobs-grid { grid-template-columns: 1fr; }
            .container { padding: 0 12px 80px; }
            h1 { font-size: 2rem; }
            .filter-bar { flex-direction: column; border-radius: 20px; padding: 14px; }
            .filter-group { min-width: 100%; }
        }
        @media (min-width: 501px) and (max-width: 768px) {
            .jobs-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1101px) and (max-width: 1500px) {
            .jobs-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (min-width: 1501px) and (max-width: 1900px) {
            .jobs-grid { grid-template-columns: repeat(5, 1fr); }
        }
        @media (min-width: 1901px) {
            .jobs-grid { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
</head>

<body>
    <!-- Global Logo -->
    <a href="index.html" style="position: absolute; top: 20px; left: 30px; display: flex; align-items: center; gap: 12px; text-decoration: none; z-index: 1000; transition: transform 0.2s ease;" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">

    <div class="filter-bar-container">
        <!-- Main Filter Bar -->
        <div class="filter-bar">
            <a href="index.html" class="mini-logo">← Home</a>
            <div class="filter-group" style="flex: 1.5;">
                <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Search company, role, location..." oninput="applyFilters()">

                <button class="exp-btn" onclick="setExperience('fresher')" id="expFresher">Fresher</button>

            </div>
            <div class="date-pills">
                <button class="date-pill active" onclick="setDateRange('all')" id="dateAll">All</button>
                <button class="date-pill" onclick="setDateRange('today')" id="dateToday">Today</button>
                <button class="date-pill" onclick="setDateRange('3days')" id="date3">3d</button>
                <button class="date-pill" onclick="setDateRange('7days')" id="date7">7d</button>

                </div>

                </div>
                <div class="source-pill" onclick="toggleSource('naukri')" id="src-naukri">
                    <img src="logos/portals/naukri.png" alt="" onerror="this.style.display='none'"> Naukri

                <div class="source-pill" onclick="toggleSource('foundit')" id="src-foundit">

            <span class="stat-chip" id="telegramCount" style="color: var(--primary); border-color: rgba(0,136,204,0.3);">✈️ <span id="telegramNum">0</span> from Telegram</span>

        <div id="loading">Loading jobs from all sources...</div>

        <div id="pagination" class="pagination-container"></div>
    </div>

        // Filter state

            'razorpay': 'razorpay.com', 'zoho': 'zoho.com', 'freshworks': 'freshworks.com',
            'ibm': 'ibm.com', 'oracle': 'oracle.com', 'sap': 'sap.com', 'dell': 'dell.com',
            'deloitte': 'deloitte.com', 'ey': 'ey.com', 'kpmg': 'kpmg.com', 'pwc': 'pwc.com',
            'hdfc': 'hdfcbank.com', 'icici': 'icicibank.com', 'sbi': 'sbi.co.in',
            'conduent': 'conduent.com', 'genpact': 'genpact.com', 'concentrix': 'concentrix.com',
            'randstad': 'randstad.com', 'naukri': 'naukri.com', 'foundit': 'foundit.in',
            'indeed': 'indeed.com', 'linkedin': 'linkedin.com', 'adobe': 'adobe.com',
            'cisco': 'cisco.com', 'intel': 'intel.com', 'nvidia': 'nvidia.com',
            'bosch': 'bosch.com', 'siemens': 'siemens.com', 'honeywell': 'honeywell.com',
            'reliance': 'relianceindustries.com', 'jio': 'jio.com', 'airtel': 'airtel.in',
            'samsung': 'samsung.com', 'nokia': 'nokia.com', 'salesforce': 'salesforce.com',
            'walmart': 'walmart.com', 'github': 'github.com', 'slack': 'slack.com'
        };

        function isLikelyPersonName(name) {
            const s = name.toLowerCase().trim();
            const words = s.split(/\s+/).filter(w => w.length > 0);
            if (words.length === 1 && /^[a-z]+$/.test(words[0]) && words[0].length <= 15) {
                const companySuffixes = ['tech', 'soft', 'sys', 'corp', 'labs', 'works', 'ware', 'net', 'hub', 'cloud', 'data', 'ai'];
                if (!companySuffixes.some(suf => words[0].endsWith(suf)) && !COMPANY_DOMAIN_MAP[words[0]]) return true;
            }
            if (words.length === 2 && words.every(w => /^[a-z]+$/.test(w))) {
                const companyKeywords = ['technologies', 'solutions', 'services', 'systems', 'software',
                    'consulting', 'group', 'global', 'digital', 'infotech', 'pvt', 'ltd', 'llp', 'inc',
                    'corp', 'limited', 'private', 'industries', 'enterprise', 'ventures', 'finance', 'bank'];
                if (!companyKeywords.some(kw => words.some(w => w.includes(kw))) && !COMPANY_DOMAIN_MAP[s]) return true;
            }
            return false;
        }

        function getLogoData(name) {
            const clean = name.replace(/\(.*\)/, '').trim();
            const key = clean.toLowerCase();
            const initial = clean.charAt(0).toUpperCase();

            if (COMPANY_DOMAIN_MAP[key]) {
                const domain = COMPANY_DOMAIN_MAP[key];
                return { clearbit: `https://logo.clearbit.com/${domain}`, google: `https://www.google.com/s2/favicons?domain=${domain}&sz=128`, initial };
            }

            if (isLikelyPersonName(clean)) {
                return { clearbit: '', google: '', initial };
            }

            const domain = key.replace(/\s+(pvt|private|ltd|limited|llp|inc|corp|technologies|solutions|services|infotech|india)\s*/gi, '')
                .replace(/ /g, '').replace(/[^\w]/g, '') + '.com';
            return { clearbit: `https://logo.clearbit.com/${domain}`, google: `https://www.google.com/s2/favicons?domain=${domain}&sz=128`, initial };
        }

        function formatDate(dateStr) {
            if (!dateStr || dateStr === 'nan' || dateStr === 'None') return null;
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return null;
                const diff = Math.floor((new Date() - d) / 86400000);
                if (diff === 0) return 'Today';
                if (diff === 1) return 'Yesterday';
                if (diff < 7) return `${diff} days ago`;
                return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
            } catch { return null; }
        }

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- SOURCE FILTER ---
        function toggleSource(name) {
            const el = document.getElementById('src-' + name);
            if (selectedSources.has(name)) {
                selectedSources.delete(name);
                if (el) el.classList.remove('active');
            } else {
                selectedSources.add(name);
                if (el) el.classList.add('active');
            }
            applyFilters();
        }

        function clearSources() {
            selectedSources.clear();
            document.querySelectorAll('.source-pill').forEach(p => p.classList.remove('active'));
            applyFilters();
        }

        // --- WALK-IN TOGGLE ---
        function toggleWalkIn() {
            walkinOnly = !walkinOnly;
            document.getElementById('walkinBtn').classList.toggle('active', walkinOnly);
            applyFilters();
        }

        // --- EXPERIENCE ---
        function setExperience(level) {
            if (activeExp === level) {
                activeExp = '';
                document.getElementById('expFresher').classList.remove('active');
                document.getElementById('expExp').classList.remove('active');
            } else {
                activeExp = level;
                document.getElementById('expFresher').classList.toggle('active', level === 'fresher');
                document.getElementById('expExp').classList.toggle('active', level === 'experienced');
            }
            applyFilters();
        }

        // --- DATE RANGE ---
        function setDateRange(range) {
            activeDate = range;
            ['dateAll', 'dateToday', 'date3', 'date7'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            const map = { 'all': 'dateAll', 'today': 'dateToday', '3days': 'date3', '7days': 'date7' };
            document.getElementById(map[range]).classList.add('active');
            applyFilters();
        }

        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function parseWalkinDates(rawDateStr, fallbackDateStr) {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            const maxFuture = new Date(now.getTime() + 60 * 24 * 60 * 60 * 1000); // 60 days rolling window (2 months)
            maxFuture.setHours(23, 59, 59, 999);

            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); // 0 to 11

            const resultDates = [];

            if (rawDateStr && typeof rawDateStr === 'string') {
                const text = rawDateStr.trim();
                let monthIdx = -1;
                let monthFullName = "";
                for (let i = 0; i < MONTH_NAMES.length; i++) {
                    const pattern = new RegExp('\\b(' + MONTH_NAMES[i] + '|' + MONTH_SHORT[i] + ')\\b', 'i');
                    if (pattern.test(text)) {
                        monthIdx = i;
                        monthFullName = MONTH_NAMES[i];
                        break;
                    }
                }

                let year = currentYear;
                const yearMatch = text.match(/\b(20\d{2})\b/);
                if (yearMatch) {
                    year = parseInt(yearMatch[1]);
                } else if (monthIdx !== -1 && monthIdx < currentMonth && (currentMonth - monthIdx > 6)) {
                    year = currentYear + 1;
                }

                if (monthIdx !== -1) {
                    const dayMatches = [...text.matchAll(/\b([0-2]?\d|3[01])(?:st|nd|rd|th)?\b/gi)]
                        .map(m => parseInt(m[1]))
                        .filter(d => d >= 1 && d <= 31);

                    if (dayMatches.length >= 2 && /\b(to|-|–|—|&)\b/i.test(text)) {
                        const minDay = Math.min(dayMatches[0], dayMatches[dayMatches.length - 1]);
                        const maxDay = Math.max(dayMatches[0], dayMatches[dayMatches.length - 1]);
                        if (maxDay - minDay <= 14) {
                            for (let d = minDay; d <= maxDay; d++) {
                                const dObj = new Date(year, monthIdx, d);
                                dObj.setHours(0, 0, 0, 0);
                                if (dObj >= now && dObj <= maxFuture) {
                                    resultDates.push({
                                        label: `${monthFullName} ${d}`,
                                        dateObj: dObj
                                    });
                                }
                            }
                        } else {
                            dayMatches.forEach(d => {
                                const dObj = new Date(year, monthIdx, d);
                                dObj.setHours(0, 0, 0, 0);
                                if (dObj >= now && dObj <= maxFuture) {
                                    resultDates.push({
                                        label: `${monthFullName} ${d}`,
                                        dateObj: dObj
                                    });
                                }
                            });
                        }
                    } else if (dayMatches.length > 0) {
                        dayMatches.forEach(d => {
                            const dObj = new Date(year, monthIdx, d);
                            dObj.setHours(0, 0, 0, 0);
                            if (dObj >= now && dObj <= maxFuture) {
                                resultDates.push({
                                    label: `${monthFullName} ${d}`,
                                    dateObj: dObj
                                });
                            }
                        });
                    }
                } else {
                    // ISO format: YYYY-MM-DD or YYYY/MM/DD
                    const isoMatch = text.match(/\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/);
                    if (isoMatch) {
                        const y = parseInt(isoMatch[1]);
                        const m = parseInt(isoMatch[2]) - 1;
                        const d = parseInt(isoMatch[3]);
                        if (m >= 0 && m <= 11 && d >= 1 && d <= 31) {
                            const dObj = new Date(y, m, d);
                            dObj.setHours(0, 0, 0, 0);
                            if (dObj >= now && dObj <= maxFuture) {
                                resultDates.push({
                                    label: `${MONTH_NAMES[m]} ${d}`,
                                    dateObj: dObj
                                });
                            }
                        }
                    } else {
                        // Numeric patterns: DD/MM/YYYY or DD-MM-YYYY or MM/DD/YYYY
                        const numMatch = text.match(/\b(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/);
                        if (numMatch) {
                            let d = parseInt(numMatch[1]);
                            let m = parseInt(numMatch[2]) - 1;
                            let y = parseInt(numMatch[3]);
                            if (y < 100) y += 2000;
                            if (m > 11 && d <= 12) {
                                const tmp = d; d = m + 1; m = tmp - 1;
                            }
                            if (m >= 0 && m <= 11 && d >= 1 && d <= 31) {
                                const dObj = new Date(y, m, d);
                                dObj.setHours(0, 0, 0, 0);
                                if (dObj >= now && dObj <= maxFuture) {
                                    resultDates.push({
                                        label: `${MONTH_NAMES[m]} ${d}`,
                                        dateObj: dObj
                                    });
                                }
                            }
                        }
                    }
                }
            }

            if (resultDates.length === 0 && fallbackDateStr) {
                const dObj = new Date(fallbackDateStr);
                if (!isNaN(dObj.getTime())) {
                    dObj.setHours(0, 0, 0, 0);
                    if (dObj >= now && dObj <= maxFuture) {
                        const m = dObj.getMonth();
                        const d = dObj.getDate();
                        resultDates.push({
                            label: `${MONTH_NAMES[m]} ${d}`,
                            dateObj: dObj
                        });
                    }
                }
            }

            const seen = new Set();
            return resultDates.filter(item => {
                if (seen.has(item.label)) return false;
                seen.add(item.label);
                return true;
            });
        }

        function getNormalizedWalkinDates(job) {
            if (!job) return [];
            const rawTitle = String(job.title || '');
            const titleLow = rawTitle.toLowerCase();
            const isWalk = Boolean(job.is_walkin || job.walking_interview || /\b(walk[\s-]?in|walking[\s-]?interview|walkin)\b/i.test(titleLow));
            if (!isWalk) return [];

            const rawDateStr = String(job.walkin_date || extractWalkinDateFromText(rawTitle) || '');
            const fallbackStr = job.date || job.fetchedAt || '';
            const parsed = parseWalkinDates(rawDateStr, fallbackStr);
            return parsed.map(p => p.label);
        }

        function extractWalkinDateFromText(text) {
            if (!text) return null;
            const isWalk = /\b(walk[\s-]?in|walking[\s-]?interview|walkin)\b/i.test(text);
            if (!isWalk) return null;
            
            // 1. Date Ranges with Month Names
            const rangeMatch = text.match(/\b(\d{1,2}(?:st|nd|rd|th)?(?:\s*,\s*\d{1,2}(?:st|nd|rd|th)?)*(?:\s+[A-Za-z]{3,9})?\s*(?:-|–|—|to|&)\s*\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]{3,9}(?:\s*,?\s*(?:20\d{2}|19\d{2}|\b\d{2}\b(?!\s*[:.])))?)\b/i);
            if (rangeMatch) return rangeMatch[1].trim();

            // 2. Single Date with Month Name
            const singleMatch = text.match(/\b(\d{1,2}(?:st|nd|rd|th)?\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*(?:\s*,?\s*(?:20\d{2}|19\d{2}|\b\d{2}\b(?!\s*[:.])))?|\d{1,2}-(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*-\d{2,4})\b/i);
            if (singleMatch) return singleMatch[1].trim();

            // 3. Numeric Date
            const numMatch = text.match(/\b(\d{1,2}[-/.](?:\d{1,2}|[A-Za-z]{3})[-/.]\d{2,4}(?:\s*(?:-|–|to)\s*\d{1,2}[-/.](?:\d{1,2}|[A-Za-z]{3})[-/.]\d{2,4})?)\b/);
            if (numMatch) return numMatch[1].trim();

            return null;
        }

        // --- LOAD ALL JOBS ---
        async function fetchAllJobs() {
            let jobs = [];
            let chunkNum = 1;
            let keepFetching = true;

            while (keepFetching) {
                try {
                    const response = await fetch(`all_jobs_${chunkNum}.json`);
                    if (!response.ok) { keepFetching = false; break; }
                    const rows = await response.json();
                    for (const job of rows) {
                        const rawTitle = job.role || job.title || "";
                        const isWalk = Boolean(job.walking_interview || job.is_walkin || /\b(walk[\s-]?in|walking[\s-]?interview|walkin)\b/i.test(rawTitle));
                        const walkDate = job.walkin_date || extractWalkinDateFromText(rawTitle);

                        jobs.push({
                            title: rawTitle,
                            company: job.company_name || job.company || "",
                            location: job.location || "",
                            date: job.job_posted_date || job.fetched_at || job.date || job.date_posted || "",
                            url: job.apply_link || job.url || job.linkedin_url || "",
                            source: (job.platform || job.source || "").toLowerCase(),
                            experience: job.experience || null,
                            salary: job.salary || null,
                            qualification: job.qualification || null,
                            walking_interview: isWalk,
                            is_walkin: isWalk,
                            walkin_date: walkDate,
                            last_date: job.last_date || null,
                            other_details: job.other_details || null,
                            role_search: job.search_keyword || job.role_search || "",
                            fetchedAt: job.job_posted_date || job.fetched_at || job.fetchedAt || job.date_posted || job.date || ""
                        });
                    }
                    chunkNum++;
                } catch (error) {
                    keepFetching = false;
                }
            }
            return jobs;
        }

        async function init() {
            const loading = document.getElementById('loading');
            allJobs = await fetchAllJobs();

            if (allJobs.length === 0) {
                loading.innerHTML = '<div style="color:#94a3b8; text-align:center"><h3>No jobs found</h3><p>Jobs database is empty. Wait for the next scraping run.</p></div>';
                return;
            }

            // Sort: newest first
            allJobs.sort((a, b) => (b.fetchedAt || '').localeCompare(a.fetchedAt || ''));

            // Populate location dropdown dynamically
            const locations = new Set();
            allJobs.forEach(j => {
                if (j.location && j.location !== 'nan' && j.location !== 'None') {
                    const city = j.location.split(',')[0].trim();
                    if (city.length > 1 && city.length < 30) locations.add(city);
                }
            });
            const locSelect = document.getElementById('locationFilter');
            [...locations].sort().forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc; opt.textContent = loc;
                locSelect.appendChild(opt);
            });

            // Update Telegram counter
            const tgCount = allJobs.filter(j => j.source === 'telegram').length;
            document.getElementById('telegramNum').textContent = tgCount;

            loading.style.display = 'none';
            applyFilters();
        }

        function applyFilters() {
            const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const loc = document.getElementById('locationFilter').value;
            const now = new Date(); now.setHours(0,0,0,0);

            filteredJobs = allJobs.filter(j => {
                const hay = [j.title, j.company, j.location, j.role_search, j.experience, j.salary].filter(Boolean).join(' ').toLowerCase();
                const titleLow = (j.title || '').toLowerCase();

                // Text search
                if (search && !hay.includes(search)) return false;

                // Location
                if (loc !== 'All' && !(j.location || '').toLowerCase().includes(loc.toLowerCase())) return false;

                // Source filter
                if (selectedSources.size > 0 && !selectedSources.has(j.source)) return false;

                // Walk-in filter
                if (walkinOnly) {
                    const isW = job.walking_interview || job.is_walkin || /\b(walk[\s-]?in|walking[\s-]?interview|walkin)\b/i.test(job.title || '');
                    if (!isW) return false;
                    const upcomingDates = getNormalizedWalkinDates(job);
                    if (upcomingDates.length === 0) return false;
                }

                // Experience
                if (activeExp === 'fresher') {
                    const combined = (titleLow + ' ' + (j.experience || '').toLowerCase());
                    if (!FRESHER_KEYWORDS.some(kw => combined.includes(kw))) return false;
                } else if (activeExp === 'experienced') {
                    const combined = (titleLow + ' ' + (j.experience || '').toLowerCase());
                    if (!EXP_KEYWORDS.some(kw => combined.includes(kw))) return false;
                }

                // Date range
                if (activeDate !== 'all') {
                    const jobDate = new Date((j.fetchedAt || '').slice(0, 10));
                    if (isNaN(jobDate.getTime())) return false;
                    const diffDays = Math.floor((now - jobDate) / 86400000);
                    if (activeDate === 'today' && diffDays > 0) return false;
                    if (activeDate === '3days' && diffDays > 3) return false;
                    if (activeDate === '7days' && diffDays > 7) return false;
                }

                return true;
            });

            // Update stats
            const walkinJobs = filteredJobs.filter(j => {
                const isW = j.walking_interview || j.is_walkin || /\b(walk[\s-]?in|walking[\s-]?interview|walkin)\b/i.test(j.title || '');
                return isW && getNormalizedWalkinDates(j).length > 0;
            }).length;
            document.getElementById('walkinCount').style.display = walkinJobs > 0 ? 'inline-flex' : 'none';
            document.getElementById('walkinNum').textContent = walkinJobs;

            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const totalPages = Math.max(1, Math.ceil(filteredJobs.length / JOBS_PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * JOBS_PER_PAGE;
            renderJobs(filteredJobs.slice(start, start + JOBS_PER_PAGE));
            renderPagination(totalPages);
            document.getElementById('jobCount').textContent = filteredJobs.length;
        }

        function goToPage(p) { currentPage = p; renderPage(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function renderJobs(jobs) {
            const grid = document.getElementById('jobsGrid');
            const noRes = document.getElementById('noResults');
            if (jobs.length === 0) { grid.innerHTML = ''; noRes.style.display = 'block'; return; }
            noRes.style.display = 'none';

            grid.innerHTML = jobs.map((job, i) => {
                const logo = getLogoData(job.company || '');
                const date = formatDate(job.date || job.fetchedAt);
                const url = job.url || '';
                const source = job.source || '';
                const sourceName = source ? (source.charAt(0).toUpperCase() + source.slice(1)) : '';
                const sourceLogoSrc = SOURCE_LOGO_MAP[source] || '';
                const stripeClass = SOURCE_STRIPE_MAP[source] || 'stripe-other';
                const rawLoc = job.location && job.location !== 'nan' && job.location !== 'None' ? job.location : '';
                const cityLoc = rawLoc ? rawLoc.split(',')[0].trim() : 'India';
                const upcomingWalkin = getNormalizedWalkinDates(job);
                const isWalkin = upcomingWalkin.length > 0 || job.walking_interview || job.is_walkin || /\b(walk[\s-]?in|walking[\s-]?interview|walkin)\b/i.test(job.title || '');
                const walkDate = upcomingWalkin.length > 0 ? upcomingWalkin[0] : (job.walkin_date || 'Upcoming');

                return `
            <div class="job-card ${isWalkin ? 'walkin-card' : ''}" style="animation-delay:${i * 0.02}s">
                <div class="card-source-stripe ${stripeClass}">
                    ${sourceLogoSrc ? `<img src="${sourceLogoSrc}" style="width:12px;height:12px;object-fit:contain;border-radius:2px;" onerror="this.style.display='none'">` : ''}
                    ${esc(sourceName)}
                </div>
                <div class="card-top">
                    <div class="logo-box">
                        <img src="${logo.clearbit}" class="company-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <img src="${logo.google}" class="company-logo" style="display:none" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="logo-fallback">${logo.initial}</div>
                    </div>
                    <div>
                        <div class="company-name">${esc(job.company)}</div>
                        <div class="job-title">${esc(job.title || 'Position')}</div>
                    </div>
                </div>
                <div class="job-details">
                    ${cityLoc ? `<div class="detail-badge">📍 ${esc(cityLoc)}</div>` : ''}
                    ${job.experience ? `<div class="detail-badge">📊 ${esc(job.experience)}</div>` : ''}
                    ${job.salary ? `<div class="detail-badge">💰 ${esc(job.salary)}</div>` : ''}
                    ${isWalkin ? `<div class="detail-badge walkin-badge">🚶 Walk-in: ${esc(walkDate)}</div>` : ''}
                    ${date ? `<div class="detail-badge" style="border-color:rgba(0,136,204,0.3);color:#0088cc;">📅 ${date}</div>` : ''}
                </div>
                <div class="card-footer">
                    <span class="card-date">${esc(job.role_search || '')}</span>
                    ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="apply-btn">Apply →</a>` : ''}
                </div>
            </div>`;
            }).join('');
        }

        function renderPagination(totalPages) {
            const c = document.getElementById('pagination');
            c.innerHTML = '';
            if (totalPages <= 1) return;
            const prev = document.createElement('button');
            prev.className = 'page-btn nav-btn'; prev.innerHTML = '←'; prev.disabled = currentPage === 1;
            prev.onclick = () => goToPage(currentPage - 1); c.appendChild(prev);
            const pages = [];
            if (totalPages <= 7) { for (let i = 1; i <= totalPages; i++) pages.push(i); }
            else {
                pages.push(1);
                if (currentPage > 3) pages.push('...');
                for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
                if (currentPage < totalPages - 2) pages.push('...');
                pages.push(totalPages);
            }
            pages.forEach(p => {
                if (p === '...') { const s = document.createElement('span'); s.className = 'page-ellipsis'; s.textContent = '...'; c.appendChild(s); }
                else { const b = document.createElement('button'); b.className = 'page-btn' + (p === currentPage ? ' active' : ''); b.textContent = p; b.onclick = () => goToPage(p); c.appendChild(b); }
            });
            const next = document.createElement('button');
            next.className = 'page-btn nav-btn'; next.innerHTML = '→'; next.disabled = currentPage === totalPages;
            next.onclick = () => goToPage(currentPage + 1); c.appendChild(next);
        }

        init();
    </script>
