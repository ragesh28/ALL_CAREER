<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Blocked</title>
    <link rel="stylesheet" href="./ui-polish.css">
    <style>
      :root {
        /* Light mode colors */
        --bg-100: #0b1220;
        --text-300: #b9c9dc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Dark mode colors */
          --bg-100: #0b1220;
          --text-300: #b9c9dc;
        }
      }

      body {
        background: var(--bg-100);
        margin: 0;
        padding: 28px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      p {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        font-style: normal;
        font-weight: 400;
        line-height: 140%;
        letter-spacing: -0.48px;
        color: var(--text-300);
        text-align: center;
        margin: 0;
        font-feature-settings: "salt" on;
        max-width: 440px;
        background: #111b2e;
        border: 1px solid rgba(148, 163, 184, .22);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 18px 36px rgba(0,0,0,.20);
      }
    </style>
  </head>
  <body>
    <p>
      The content on this page isn't available<br />when AutoFill V4 is active for
      safety reasons.
    </p>
  </body>
</html>
