<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Auto Fill V4</title>
  <link rel="stylesheet" href="ui-polish.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" id="popupContainer">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <img class="brand-mark" src="assets/autofill-mark.svg" alt="AutoFill Studio">
        <span class="logo-text">AutoFill</span>
        <span class="badge">STUDIO</span>
      </div>
    </header>

    <!-- Profile Summary Card -->
    <div class="profile-card" id="profileCard">
      <div class="profile-name" id="profileName">Profile not set</div>
      <div class="profile-meta" id="profileMeta">0 learned fields</div>
    </div>

    <!-- 2x2 Clean Tools Grid: Only AI Chat, Workflows, History, Settings -->
    <div class="tools-grid-four">
      <button class="tool-btn-featured" id="btnAiChat">
        <svg class="tool-mark tool-mark-chat" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7.5h16.5A3.5 3.5 0 0 1 25 11v7.5a3.5 3.5 0 0 1-3.5 3.5H13l-5.5 4v-4H5A3.5 3.5 0 0 1 1.5 18.5V11A3.5 3.5 0 0 1 5 7.5Z"/><path d="M8 13h10M8 17h7"/></svg>
        <span class="btn-title">AI Chat</span>
        <span class="btn-desc">Autonomous Assistant</span>
      </button>

      <button class="tool-btn-featured" id="btnWorkflows">
        <svg class="tool-mark tool-mark-flow" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7v7m0 0h9m0 0v11m0-11h9M7 14v11"/><path d="M4 4h6v6H4zM13 11h6v6h-6zM22 11h6v6h-6zM4 22h6v6H4zM13 22h6v6h-6z"/></svg>
        <span class="btn-title">Workflows</span>
        <span class="btn-desc">Automation Studio</span>
      </button>

      <button class="tool-btn-featured" id="btnHistory">
        <svg class="tool-mark tool-mark-history" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 9.5A10.5 10.5 0 1 1 5.6 16H2.5m0 0 3.4-3.5M2.5 16l3.4 3.5"/><path d="M16 10v6l4 2.7"/></svg>
        <span class="btn-title">History</span>
        <span class="btn-desc">Execution Logs</span>
      </button>

      <button class="tool-btn-featured" id="btnSettings">
        <svg class="tool-mark tool-mark-settings" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 9h20M6 16h20M6 23h20"/><path d="M11 6v6m10 1v6M15 20v6"/></svg>
        <span class="btn-title">Settings</span>
        <span class="btn-desc">System Preferences</span>
      </button>
    </div>

    <!-- Notification / Status Banner -->
    <div id="statusBanner" class="status-banner" style="display: none;"></div>
  </div>

  <script src="ui-polish.js"></script>
  <script src="popup.js"></script>
</body>
</html>
