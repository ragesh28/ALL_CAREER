<!DOCTYPE html>
<html lang="en" data-theme="claude">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude — Workflow Recorder</title>
  <link rel="icon" type="image/svg+xml" href="/icon-128.png">
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #161b22;
      --bg-header: #21262d;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-orange: #d97757;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-teal: #14b8a6;
      --accent-red: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg-main); color: var(--text-main); font-size: 13px; }
    
    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 0 16px;
    }
    
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    
    .status-banner {
      padding: 9px 14px;
      background: #064e3b;
      border-bottom: 1px solid #059669;
      color: #a7f3d0;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-banner.disconnected {
      background: #7c2d12;
      border-bottom-color: #ea580c;
      color: #fed7aa;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
    }
    .head-title { font-size: 15px; font-weight: 700; color: #fff; }
    .head-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
    
    .body { display: grid; gap: 12px; padding: 16px; }
    
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .meta-step { font-weight: 700; color: var(--accent-orange); font-size: 13px; }
    
    label {
      display: grid;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="text"], input[type="number"], select {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #090d13;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--accent-orange);
    }

    .tab-info-card {
      padding: 8px 12px;
      background: #0e1726;
      border: 1px solid #1e293b;
      border-radius: 6px;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tab-info-card strong { color: #e2e8f0; }
    .tab-info-card span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; color: var(--accent-blue); }

    .ai-options-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 10px;
      display: none;
      gap: 8px;
    }
    
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 12px;
      text-transform: none;
      cursor: pointer;
      margin-top: 2px;
    }
    .checkbox-row input { width: 15px; height: 15px; accent-color: var(--accent-orange); }

    .fill-box {
      display: none;
      grid-template-columns: 1fr auto;
      gap: 8px;
      background: #111827;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: #238636;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }
    button.btn-blue { background: #1f6feb; }
    button.btn-gray { background: #21262d; border-color: var(--border-color); color: #c9d1d9; }
    button.btn-gray:hover { background: #30363d; }
    button.btn-finish { background: #238636; }
    button.btn-orange { background: var(--accent-orange); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-msg {
      min-height: 36px;
      padding: 9px 12px;
      border-left: 3px solid var(--accent-green);
      background: #090d13;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      line-height: 1.4;
      color: #a7f3d0;
    }

    /* Live Steps List */
    .steps-list-card {
      margin-top: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
    .steps-list-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090d13;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .step-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      margin-right: 8px;
    }
    .step-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
    .step-del {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <!-- Status Banner -->
      <div class="status-banner" id="conn-banner">
        <span id="conn-text">🟢 Connected to website tab — ready to record</span>
        <button class="step-del" id="btn-refresh-conn" title="Refresh Target Tab" style="color:#fff;">🔄</button>
      </div>

      <!-- Header -->
      <div class="head">
        <div>
          <div class="head-title">Workflow Step Recorder</div>
          <div class="head-sub" id="wf-name-label">Recorded workflow</div>
        </div>
        <button class="btn-gray" id="btn-back-studio" style="height:30px;font-size:11px;padding:0 10px;">⚡ Studio</button>
      </div>

      <!-- Body -->
      <div class="body">
        <!-- Target Tab Info -->
        <div class="tab-info-card">
          <strong>Target page:</strong>
          <span id="tab-title-val">Detecting target website...</span>
        </div>

        <div class="meta-row">
          <span class="meta-step" id="step-num-label">Step 1</span>
          <span id="loop-state-label">No active loop</span>
        </div>

        <!-- Step Name -->
        <label>
          Step Name
          <input type="text" id="step-name-input" placeholder="e.g. Click Apply or Type CTC" />
        </label>

        <!-- Action Selection -->
        <label>
          Action Type
          <select id="action-type-select">
            <option value="click" selected>Click element (auto detect)</option>
            <option value="fill">Type anything (fill text)</option>
            <option value="dropdown">Select dropdown option</option>
            <option value="checkbox">Toggle checkbox</option>
            <option value="multiple_choice">Select radio / choice</option>
            <option value="file_upload">Upload resume</option>
            <option value="ai_step">AI question &amp; answer (auto-fill)</option>
            <option value="loop">Start loop from element</option>
            <option value="loop_end">End loop when element appears</option>
            <option value="full_end">End workflow when element appears</option>
          </select>
        </label>

        <!-- AI Options -->
        <div class="ai-options-box" id="ai-options-box">
          <label>
            Question Fields to Handle
            <select id="ai-elements-count">
              <option value="1">1 element (Single box / Auto-detect)</option>
              <option value="2" selected>2 elements (Question + Answer box)</option>
              <option value="3">3 elements (Question + Answer + Save button)</option>
              <option value="4">4 elements (Question + Multiple inputs)</option>
              <option value="5">5 elements (Complex questionnaire)</option>
            </select>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" id="ai-full-page-chk" />
            <span>Full tab context (AI reads whole page)</span>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" id="ai-prompt-chk" />
            <span>Add custom AI instructions</span>
          </label>
          <input type="text" id="ai-custom-prompt" placeholder="e.g. Current CTC 8 LPA, 2 yrs experience" style="display:none;" />
        </div>

        <!-- Fill Editor -->
        <div class="fill-box" id="fill-box">
          <input type="text" id="fill-val-input" placeholder="Value or {{role}} or {{location}}" />
          <button class="btn-blue" id="btn-save-fill">Save Text</button>
        </div>

        <!-- Action Buttons -->
        <div class="btn-row">
          <button class="btn-orange" id="btn-pick-element">🎯 Pick Element on Page</button>
          <button class="btn-blue" id="btn-add-step-manual">+ Add Step</button>
        </div>

        <div class="btn-row">
          <button class="btn-gray" id="btn-undo-step">↺ Undo Last Step</button>
          <button class="btn-finish" id="btn-finish-wf">💾 Finish &amp; Save</button>
        </div>

        <!-- Instruction Status -->
        <div class="status-msg" id="status-box">
          Click "Pick Element" or click on the website tab to record this step.
        </div>

        <!-- Live Steps List -->
        <div class="steps-list-card">
          <div class="steps-list-title">
            <span>Recorded Steps (<span id="steps-count">0</span>)</span>
            <span style="color:var(--accent-orange);">Live Graph</span>
          </div>
          <div id="steps-container"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./recorder.js"></script>
</body>
</html>
