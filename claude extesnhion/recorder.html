<!DOCTYPE html>
<html lang="en" data-theme="claude">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Workflow Recorder — Side Panel</title>
  <link rel="icon" type="image/svg+xml" href="/icon-128.png">
  <style>
    :root {
      --bg-panel: #161a22;
      --bg-header: #202631;
      --bg-input: #10141b;
      --border-color: #394150;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-label: #aeb8c7;
      --accent-orange: #d97757;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-emerald: #047857;
      --accent-amber: #a16207;
      --btn-secondary: #303846;
      --btn-secondary-border: #4b5563;
      --accent-red: #ef4444;
    }
    * {
      box-sizing: border-box;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      letter-spacing: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-panel);
      color: var(--text-main);
      font-size: 12px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .panel {
      background: var(--bg-panel);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }
    .head-info { flex: 1; min-width: 0; }
    .title { font-size: 13px; font-weight: 750; color: #fff; }
    .sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }
    .icon-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      background: var(--btn-secondary);
      border: 1px solid var(--btn-secondary-border);
      border-radius: 5px;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-toggle:hover { background: #3b82f6; border-color: #60a5fa; color: #fff; }

    .status-banner {
      padding: 7px 12px;
      background: rgba(6, 78, 59, 0.6);
      border-bottom: 1px solid rgba(5, 150, 105, 0.4);
      color: #a7f3d0;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-banner.disconnected {
      background: rgba(124, 45, 18, 0.6);
      border-bottom-color: rgba(234, 88, 12, 0.4);
      color: #fed7aa;
    }

    .body {
      display: grid;
      gap: 9px;
      padding: 12px;
      flex: 1;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .meta strong { color: var(--accent-orange); font-size: 12px; }

    label {
      display: grid;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-label);
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid #465064;
      border-radius: 5px;
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .wait-option {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      text-transform: none;
      cursor: pointer;
    }
    .wait-option input {
      width: 15px;
      height: 15px;
      padding: 0;
      accent-color: var(--accent-blue);
    }
    .wait-target {
      min-height: 14px;
      margin-top: -3px;
      color: #93c5fd;
      font: 10px/1.3 Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-panel {
      background: #10141b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      display: none;
      gap: 6px;
    }

    .fill-editor {
      display: none;
      grid-template-columns: 1fr auto;
      gap: 7px;
      padding: 8px;
      background: #222936;
      border: 1px solid #465064;
      border-radius: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      height: 34px;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:hover { opacity: 0.93; }
    button:active { transform: scale(0.98); }
    button.btn-pick { background: var(--accent-orange); }
    button.btn-add { background: #2563eb; }
    button.secondary { background: var(--btn-secondary); border-color: var(--btn-secondary-border); color: #e2e8f0; }
    button.inspecting { background: #0f766e; border-color: #2dd4bf; color: #fff; }
    button.loop { background: var(--accent-amber); }
    button.finish { background: var(--accent-emerald); }
    button:disabled { opacity: .35; cursor: not-allowed; }

    #wf-status {
      min-height: 28px;
      padding: 7px 8px;
      border-left: 3px solid var(--accent-green);
      background: var(--bg-input);
      font-size: 11px;
      line-height: 1.35;
      color: #a7f3d0;
      border-radius: 0 4px 4px 0;
    }

    /* Steps List */
    .steps-card {
      margin-top: 6px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
    .steps-head {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 6px 8px;
      margin-bottom: 5px;
      font-size: 11px;
    }
    .step-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      color: #fff;
      margin-right: 6px;
      letter-spacing: 0.3px;
    }
    .step-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
    }
    .step-del {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 4px;
      height: auto;
    }
    .step-del:hover { color: #f87171; }
  </style>
</head>
<body>
  <section class="panel">
    <!-- Header -->
    <div class="head">
      <div class="head-info">
        <div class="title">Manual workflow recorder</div>
        <div class="sub" id="wf-name-label">Recorded workflow</div>
      </div>
      <div class="head-actions">
        <button id="btn-back-studio" class="icon-toggle" title="Open Studio Hub">⚡ Studio</button>
      </div>
    </div>

    <!-- Status Banner -->
    <div class="status-banner" id="conn-banner">
      <span id="conn-text">🟢 Connected to target tab. Pick an element or add a step.</span>
      <button class="step-del" id="btn-refresh-conn" title="Refresh Target Tab" style="color:#fff;font-size:12px;">🔄</button>
    </div>

    <!-- Body -->
    <div class="body">
      <!-- Step Meta -->
      <div class="meta">
        <strong id="wf-step-number">Step 1</strong>
        <span id="wf-loop-state">No active loop</span>
      </div>

      <!-- Step Name -->
      <label>
        Step name
        <input id="wf-step-name" placeholder="Example: Click Search" />
      </label>

      <!-- Action Select -->
      <label>
        Action
        <select id="wf-mode">
          <option value="click" selected>Click element (auto detect)</option>
          <option value="fill">Type anything</option>
          <option value="dropdown">Select dropdown</option>
          <option value="checkbox">Checkbox</option>
          <option value="multiple_choice">Multiple choice</option>
          <option value="file_upload">File upload</option>
          <option value="ai_step">AI question and answer</option>
          <option value="loop">Start loop from element</option>
          <option value="loop_end">End loop when element appears</option>
          <option value="full_end">End workflow when element appears</option>
        </select>
      </label>

      <!-- AI Options -->
      <div id="wf-ai-editor" class="ai-panel">
        <label id="wf-ai-element-count-label">
          Number of elements to select
          <select id="wf-ai-element-count">
            <option value="1">1 element (Single box / Auto-detect)</option>
            <option value="2" selected>2 elements (Question + Answer box)</option>
            <option value="3">3 elements (Question + Answer + Save button)</option>
            <option value="4">4 elements (Question + Multiple inputs)</option>
            <option value="5">5 elements (Complex questionnaire)</option>
          </select>
        </label>

        <label id="wf-ai-full-page-label" class="wait-option">
          <input id="wf-ai-full-page" type="checkbox" />
          Full tab context (AI reads whole active tab)
        </label>

        <label id="wf-ai-custom-prompt-label" class="wait-option">
          <input id="wf-ai-custom-prompt-toggle" type="checkbox" />
          Add custom AI instructions
        </label>
        <div id="wf-ai-prompt-box" style="display:none;padding:2px 0;">
          <input id="wf-ai-prompt-input" placeholder="Custom AI instructions (e.g. CTC 8 LPA, 2 yrs exp)" />
        </div>
      </div>

      <!-- Wait For Element Option -->
      <label class="wait-option">
        <input id="wf-wait-for-element" type="checkbox" />
        Wait for selected element to appear
      </label>
      <div id="wf-wait-target" class="wait-target"></div>

      <!-- Fill Editor -->
      <div id="wf-fill-editor" class="fill-editor">
        <input id="wf-fill-value" placeholder="Value or {{role}} or {{location}}" />
        <button id="wf-save-fill" class="btn-add">Save</button>
      </div>

      <!-- Button Rows matching Autofill V4 -->
      <div class="row">
        <button id="wf-pick" class="btn-pick" title="Pick an element on the target page">🎯 Pick Element</button>
        <button id="wf-add-step" class="btn-add" title="Add step directly">+ Add Step</button>
      </div>

      <div class="row">
        <button id="wf-undo" class="secondary" title="Delete the previous recorded step and return to its page">↺ Undo step &amp; back</button>
        <button id="wf-inspect" class="secondary" title="Allow exactly one website click without recording it">Stop working</button>
      </div>

      <div class="row">
        <button id="wf-end-loop" class="loop" disabled title="End the current loop">End loop now</button>
        <button id="wf-finish" class="finish" title="Finish recording and save workflow">Finish and save</button>
      </div>

      <!-- Status Message -->
      <div id="wf-status">Choose an action, then select an element on the page.</div>

      <!-- Live Steps List -->
      <div class="steps-card">
        <div class="steps-head">
          <span>Recorded steps (<span id="steps-count">0</span>)</span>
          <span style="color:var(--accent-orange);">Live Graph</span>
        </div>
        <div id="steps-container"></div>
      </div>
    </div>
  </section>

  <script type="module" src="./recorder.js"></script>
</body>
</html>
