<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="284" viewBox="0 0 1040 284" role="img">
  <title>Job card with posting date and required experience</title>
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b1716"/>
      <stop offset="1" stop-color="#1b3329"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#476759" opacity=".45"/>
    </pattern>
  </defs>
  <style>
  text { font-family: 'Segoe UI', system-ui, sans-serif; }
  .arrive { animation: arrive 850ms cubic-bezier(.22,.78,.25,1) 160ms both; }
  .later { animation-delay: 480ms; }
  .signal {
    stroke-dasharray: 7 93;
    opacity: 0;
    animation: send 1550ms cubic-bezier(.22,.78,.25,1) 350ms 2;
  }
  .signal-later { animation-delay: 680ms; }
  .highlight { animation: highlight 1.3s cubic-bezier(.22,.78,.25,1) 540ms both; }
  @keyframes arrive {
    from { opacity: .35; transform: translateY(9px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes send {
    0% { opacity: 0; stroke-dashoffset: 7; }
    12%, 78% { opacity: 1; }
    100% { opacity: 0; stroke-dashoffset: -100; }
  }
  @keyframes highlight {
    0% { opacity: .3; }
    45%, 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .arrive, .signal, .highlight { animation: none; }
  }
  </style>
  <rect x="0.5" y="0.5" width="1039" height="283" rx="27" fill="url(#surface)" stroke="#345348"/>
  <rect x="36" y="42" width="378" height="200" rx="18" fill="#101e1a" stroke="#345348"/>
  <text x="59" y="78" fill="#b5c9bd" font-size="14" font-weight="650" letter-spacing="1.4">INSIDE THE LISTING</text>
  <text x="59" y="129" fill="#eef7ed" font-size="19" font-weight="500" >“Minimum 3 years of experience</text>
  <text x="59" y="156" fill="#eef7ed" font-size="19" font-weight="500" >building and testing web apps.”</text>
  <text x="59" y="202" fill="#b5c9bd" font-size="16" font-weight="400" >Posted two days ago</text>
  <path d="M423 142 H501 M492 134 L501 142 492 150" fill="none" stroke="#88a895" stroke-width="1.5"/>
  <path class="signal" d="M423 142 H501" pathLength="100" fill="none" stroke="#bcf2a6" stroke-width="2.5"/>
<g class="arrive later">
  <rect x="522" y="32" width="482" height="220" rx="20" fill="#1a2c25" stroke="#517861"/>
  <text x="549" y="76" fill="#bcf2a6" font-size="13" font-weight="650" letter-spacing="1.4">ALL CAREER  /  EXAMPLE</text>
  <text x="548" y="121" fill="#eef7ed" font-size="32" font-weight="700" letter-spacing="-1.25">Software Engineer</text>
  <text x="550" y="149" fill="#b5c9bd" font-size="16" font-weight="400" >Chennai · Naukri</text>
  <rect x="548" y="170" width="200" height="57" rx="10" fill="#203c2c"/>
  <rect x="754" y="170" width="224" height="57" rx="10" fill="#203c2c"/>
<g class="highlight">
  <text x="562" y="191" fill="#b5c9bd" font-size="13" font-weight="500" >Posted</text>
  <text x="562" y="214" fill="#bcf2a6" font-size="18" font-weight="700" >2 days ago</text>
  <text x="769" y="191" fill="#b5c9bd" font-size="13" font-weight="500" >Experience</text>
  <text x="769" y="214" fill="#bcf2a6" font-size="18" font-weight="700" >Minimum 3 years</text>
</g>
</g>
</svg>
