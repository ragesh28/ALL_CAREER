<svg xmlns="http://www.w3.org/2000/svg" width="328" height="58" viewBox="0 0 328 58" role="img">
  <title>Learn Coding</title>
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b1716"/>
      <stop offset="1" stop-color="#1b3329"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#476759" opacity=".45"/>
    </pattern>
  </defs>
  <style>
  text { font-family: 'Segoe UI', system-ui, sans-serif; }
  .trace {
    opacity: 0;
    animation: travel 5.4s cubic-bezier(.28,.74,.36,1) infinite;
  }
  @keyframes travel {
    0%, 68%, 100% { opacity: 0; transform: translateX(0); }
    74% { opacity: 1; }
    87% { opacity: 1; transform: translateX(12px); }
    93% { opacity: 0; transform: translateX(12px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .trace { animation: none; }
  }
  </style>
  <rect x="0.5" y="0.5" width="327" height="57" rx="13" fill="url(#surface)" stroke="#345348"/>
  <rect x="12" y="12" width="34" height="34" rx="9" fill="#223a2f"/>
<path d="M18 29h22" fill="none" stroke="#e6b9f0" stroke-width="1" stroke-opacity=".45" stroke-linecap="round"/>
<circle cx="18" cy="29" r="2" fill="#e6b9f0"/>
<path class="trace" style="animation-delay:920ms" d="M18 29h8" fill="none" stroke="#e6b9f0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="58" y="36" fill="#eef7ed" font-size="19" font-weight="700" letter-spacing="-.25">Learn Coding</text>
  <rect x="282" y="12" width="34" height="34" rx="9" fill="#223a2f" stroke="#466656"/>
